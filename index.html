<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경제학 OX 퀴즈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans text-slate-800">

    <header class="w-full max-w-2xl mx-auto mb-4 flex flex-col sm:flex-row justify-between items-center gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-center">
                <i class="fa-solid fa-book-bookmark text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">경제학 OX 퀴즈</h1>
                <p class="text-xs text-slate-500">교재 문제 기반 OX 학습기</p>
            </div>
        </div>

        <!-- Controls: Shuffle, Reset, CSV Upload, Template Download -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <button onclick="shuffleDeck()" title="현재 카드를 무작위로 섞습니다" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all border border-indigo-200 active:scale-95">
                <i class="fa-solid fa-shuffle"></i>
                <span>카드 섞기</span>
            </button>
            <button onclick="resetToDefaultDeck()" title="기본 문제 덱으로 초기화" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition-all border border-rose-200 active:scale-95">
                <i class="fa-solid fa-rotate-left"></i>
                <span>초기화</span>
            </button>
            <button onclick="downloadCSVTemplate()" title="CSV 템플릿 다운로드" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all border border-slate-200">
                <i class="fa-solid fa-file-csv text-indigo-600"></i>
                <span>템플릿</span>
            </button>
            <label for="csvFileInput" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 rounded-xl cursor-pointer shadow-sm transition-all">
                <i class="fa-solid fa-file-import"></i>
                <span>CSV 업로드</span>
            </label>
            <input type="file" id="csvFileInput" accept=".csv, .tsv, .txt" class="hidden" onchange="handleCSVUpload(event)">
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto flex-1 flex flex-col justify-center">
        
        <!-- Filter & Progress Container -->
        <div class="mb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-filter text-xs text-indigo-500"></i>
                    <span class="text-xs font-bold text-slate-600">필터:</span>
                </div>
                <div class="flex items-center gap-1.5 overflow-x-auto text-xs font-medium">
                    <button id="filterAll" onclick="setFilter('ALL')" class="px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 font-bold border border-indigo-200 transition-all">전체 (<span id="countAll">0</span>)</button>
                    <button id="filterIncorrect" onclick="setFilter('INCORRECT')" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all">틀린 지문 (<span id="countIncorrect">0</span>)</button>
                    <button id="filterUnanswered" onclick="setFilter('UNANSWERED')" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all">미풀이 (<span id="countUnanswered">0</span>)</button>
                </div>
            </div>

            <!-- Progress Info -->
            <div class="flex justify-between items-center">
                <span id="progressText" class="text-sm font-semibold text-slate-700">0 / 0</span>
                <span id="resultBadge" class="hidden text-xs font-bold px-3 py-1 rounded-full shadow-sm"></span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden border border-slate-200">
                <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300 rounded-full"></div>
            </div>
        </div>

        <div class="perspective-1000 w-full h-80 cursor-pointer my-2" id="cardContainer">
            <div id="flashcard" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-3xl shadow-lg border border-slate-200/80 bg-white">
                
                <!-- Front Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden p-6 sm:p-8 flex flex-col justify-between items-center text-center bg-white rounded-3xl">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold tracking-wider text-indigo-600 uppercase bg-indigo-50 border border-indigo-100 px-3 py-1 rounded-full">지문</span>
                        <span id="cardBadge" class="text-xs text-slate-400 font-medium"></span>
                    </div>
                    
                    <p id="articleText" class="text-base sm:text-lg font-semibold text-slate-800 break-keep leading-relaxed my-auto max-h-48 overflow-y-auto no-scrollbar w-full px-2">
                        질문을 불러오는 중입니다...
                    </p>
                    
                    <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                        <i class="fa-solid fa-rotate text-indigo-400"></i>
                        <span>카드를 클릭하면 정답과 해설이 뒤집힙니다</span>
                    </div>
                </div>

                <!-- Back Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 p-6 sm:p-8 flex flex-col justify-between items-center text-center bg-slate-900 text-white rounded-3xl shadow-inner">
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-xs font-bold tracking-wider text-slate-400 uppercase bg-slate-800 px-3 py-1 rounded-full border border-slate-700">정답 해설</span>
                        <div id="correctAnswerDisplay" class="text-3xl font-black mt-1"></div>
                    </div>
                    
                    <div class="overflow-y-auto max-h-36 my-auto w-full px-2 no-scrollbar">
                        <p id="reasonText" class="text-sm sm:text-base text-slate-200 leading-relaxed break-keep font-medium"></p>
                    </div>
                    
                    <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                        <i class="fa-solid fa-rotate text-slate-400"></i>
                        <span>카드를 클릭하면 지문으로 돌아갑니다</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- OX Answer Buttons -->
        <div class="grid grid-cols-2 gap-4 mt-4">
            <button id="btnAnswerO" onclick="submitAnswer('O')" class="py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-2xl rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-regular fa-circle text-2xl"></i>
                <span>맞음 (O)</span>
            </button>
            <button id="btnAnswerX" onclick="submitAnswer('X')" class="py-4 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-extrabold text-2xl rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-xmark text-2xl"></i>
                <span>틀림 (X)</span>
            </button>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center mt-4 gap-4">
            <button id="btnPrev" onclick="prevCard()" class="flex-1 py-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-xl text-sm shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2">
                <i class="fa-solid fa-chevron-left"></i>
                <span>이전 카드</span>
            </button>
            <button id="btnResetCurrent" onclick="resetCurrentCardState()" class="px-3 py-3 bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-600 font-semibold rounded-xl text-xs shadow-sm transition-all" title="이 카드의 학습 기록 초기화">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button id="btnNext" onclick="nextCard()" class="flex-1 py-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-xl text-sm shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2">
                <span>다음 카드</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </main>

    <footer class="w-full max-w-2xl mx-auto mt-6 text-center text-xs text-slate-400">
        경제학 OX 퀴즈 &copy; Smart Study App
    </footer>

    <script>
        const STORAGE_KEY_DECK = "economics_quiz_deck_v2";
        const STORAGE_KEY_ANSWERS = "economics_quiz_answers_v2";

        // 200개 문항 기본 내장 데이터
        const defaultDeck = [
            {"id": 1, "article": "[케인즈의 화폐수요이론] 거래적 동기의 화폐수요는 소득수준과 관련이 있다.", "answer": "O", "reason": "거래적 화폐수요로서 거래목적을 위해서 화폐를 수요하는 것으로서 소득이 증가하면 거래규모가 커지면서 거래적 화폐수요도 증가한다."},
            {"id": 2, "article": "[계산] 본원통화 200, 현금통화비율 0.2, 지급준비율 0.1일 때 통화량 = 800이다.", "answer": "O", "reason": "맞습니다. 통화승수 (1+k)/(k+r)=4 → 800"},
            {"id": 3, "article": "[계산] 수요곡선 Qd = a - P, 공급곡선 Qs = c + 2P인 시장에서 공급자에게 단위당 24원의 종량세를 부과할 때 소비자가 부담하는 가격 인상분 = 24원이다.", "answer": "X", "reason": "정답은 16원입니다. 소비자 부담 = t×d/(b+d)"},
            {"id": 4, "article": "[재화 X 의 가격이 상승할 때 나타나는 효과] 재화 X 가 정상재라면 수요량은 감소한다", "answer": "O", "reason": "특정재화의 가격이 상승할 경우 해당 재화가 정상재라면 수요량은 감소한다."},
            {"id": 5, "article": "[단기총공급곡선] 가격경직성 모형은 기업들이 가격수용자라고 전제한다.", "answer": "X", "reason": "가격경직성 모형은 기업들이 가격수용자가 아니라 가격설정자라고 전제하고 메뉴비용이론을 전제한다."},
            {"id": 6, "article": "[계산] 빅맥이 미국에서 5달러, 한국에서 5,500원이고 실제 환율이 1500원/달러일 때, 구매력평가설 기준으로 원화는 달러 대비 저평가되어 있다.", "answer": "O", "reason": "맞습니다. PPP환율 1,100원 vs 실제 1500원."},
            {"id": 7, "article": "[계산] 역수요함수가 P = 38 - 2Q이고 시장가격이 4일 때 소비자잉여 = 289이다.", "answer": "O", "reason": "맞습니다. 균형량 17, ½×(38-4)×17 → 289"},
            {"id": 8, "article": "[계산] X재와 Y재만 생산하는 국가의 기준연도 가격은 각각 2, 1이고 비교연도 가격은 4, 3이며 비교연도 생산량은 16개, 7개일 때(GDP디플레이터 기준) 물가상승률 = 117.95%이다.", "answer": "O", "reason": "맞습니다. 디플레이터 = 85/39×100 → 117.95%"},
            {"id": 9, "article": "[계산] 역수요함수가 P = 24 - 1Q이고 시장가격이 8일 때 소비자잉여 = 192이다.", "answer": "X", "reason": "정답은 128입니다. 균형량 16, ½×(24-8)×16"},
            {"id": 10, "article": "[기업의 시장구조와 행동원리] 독점적 경쟁시장에서 이윤극대화를 추구하는 기업의 장기균형 생산량은 평균비용이 최소가 되 는점이다.", "answer": "X", "reason": "독점적 경쟁기업의 장기균형은 한계수입과 한계비용(장기의 한계비용)이 일치할 때 달성된다."},
            {"id": 11, "article": "[기업의 시장구조와 행동원리] 꾸르노 (Cournot) 과점시장모델에서 기업 수가 많아질수록 시장전체의 산출량은 증가한다.", "answer": "O", "reason": "꾸르노모형에서 참가사업자가 많아질수록 사업자 수 측면에서 경쟁시장의 구조에 가까워지면서 산출량도 경쟁시장의 산출량에 근접한다."},
            {"id": 12, "article": "[계산] 빅맥이 미국에서 5달러, 한국에서 5,500원이고 실제 환율이 800원/달러일 때, 구매력평가설 기준으로 원화는 달러 대비 저평가되어 있다.", "answer": "X", "reason": "틀립니다. PPP환율 1,100원 vs 실제 800원."},
            {"id": 13, "article": "[계산] 자본소득분배율이 0.33인 경제에서 기술진보율 2%, 자본증가율 4%, 노동증가율 0%일 때 경제성장률 = 4.33%이다.", "answer": "X", "reason": "정답은 3.33%입니다. g=gA+α·gK+(1-α)·gL"},
            {"id": 14, "article": "[계산] 폐쇄경제에서 C = 50 + 0.75(Y - T), 투자 50, 정부지출 50, 조세 100일 때 균형국민소득 = 150이다.", "answer": "X", "reason": "정답은 300입니다. Y=(50-0.75×100+50+50)/(1-0.75)"},
            {"id": 15, "article": "[계산] 빅맥이 미국에서 5달러, 한국에서 5,000원이고 실제 환율이 1300원/달러일 때, 구매력평가설 기준으로 원화는 달러 대비 저평가되어 있다.", "answer": "O", "reason": "맞습니다. PPP환율 1,000원 vs 실제 1300원."},
            {"id": 16, "article": "[계산] 가격이 500원에서 600원으로 인상되자 수요량이 1,000개에서 600개로 감소하였다(변화율은 변화 전 기준). 수요의 가격탄력성(절댓값) = 2이다.", "answer": "O", "reason": "맞습니다. 가격 20% 상승, 수요량 40% 감소 → 40/20 → 2"},
            {"id": 17, "article": "[단기총공급곡선] 불완전정보 모형에서 기대 물가수준이 상승하면 단기총공급곡선은 오른쪽으로 이동한다.", "answer": "X", "reason": "불완전정보 모형에서 기대 물가수준이 상승하면 단기총공급곡선은 오른쪽이 아니라 좌상방으로 이동한다."},
            {"id": 18, "article": "[케인즈 소비함수] 한계소비성향은 0보다 크고 1 보다 작다.", "answer": "O", "reason": "한계소비성향은 소득증가분에서 소비증가분이 차지하는 비중으로서 0 보다 크고 1보다 작다."},
            {"id": 19, "article": "[계산] X재와 Y재만 생산하는 국가의 기준연도 가격은 각각 1, 1이고 비교연도 가격은 4, 3이며 비교연도 생산량은 7개, 13개일 때(GDP디플레이터 기준) 물가상승률 = 235%이다.", "answer": "O", "reason": "맞습니다. 디플레이터 = 67/20×100 → 235%"},
            {"id": 20, "article": "[계산] 생산함수가 y = √k, 저축률 0.2, (인구증가율+감가상각률) 0.2인 솔로우 모형에서 균제상태 1인당 자본량 = 0.5이다.", "answer": "X", "reason": "정답은 1입니다. s√k=(n+δ)k → k=(s/(n+δ))²"},
            {"id": 21, "article": "[계산] 완전경쟁기업의 총비용함수가 TC = Q² + 20이고 시장가격이 10일 때 이윤극대화 시 이윤 = 25이다.", "answer": "X", "reason": "정답은 5입니다. MC=2Q=P → Q=5, 이윤=10×5-25-20"},
            {"id": 22, "article": "[원점에 대해 오목한 생산가능곡선] 원점에 대해 볼록한 사회무차별곡선이 주어진다면 생산가능곡선 선상의 한 점에서 최적의 생산 수준이 결정된다", "answer": "O", "reason": "사회적 최적 수준의 생산은 생산제약 하에서 사회후생을 극대화할 때 달성되는데, 이를 기하적으로 나타내 면 사회무차별곡선과 생산가능곡선이 역할 때가 된다."},
            {"id": 23, "article": "[계산] X재와 Y재만 생산하는 국가의 기준연도 가격은 각각 3, 3이고 비교연도 가격은 3, 4이며 비교연도 생산량은 12개, 8개일 때(GDP디플레이터 기준) 물가상승률 = 13.33%이다.", "answer": "O", "reason": "맞습니다. 디플레이터 = 68/60×100 → 13.33%"},

            } else if (currentFilter === 'INCORRECT') {
                currentDeck = rawDeck.filter(card => {
                    const ans = userAnswers[getCardKey(card)];
                    return ans && !ans.isCorrect;
                });
            } else if (currentFilter === 'UNANSWERED') {
                currentDeck = rawDeck.filter(card => {
                    const ans = userAnswers[getCardKey(card)];
                    return !ans;
                });
            }

            currentIndex = 0;
            renderCard();
        }

        function updateFilterCounts() {
            document.getElementById('countAll').textContent = rawDeck.length;

            let incCount = 0;
            let unansCount = 0;

            rawDeck.forEach(card => {
                const ans = userAnswers[getCardKey(card)];
                if (!ans) unansCount++;
                else if (!ans.isCorrect) incCount++;
            });

            document.getElementById('countIncorrect').textContent = incCount;
            document.getElementById('countUnanswered').textContent = unansCount;
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                let text = "";

                try {
                    const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
                    text = utf8Decoder.decode(buffer);
                } catch (err) {
                    try {
                        const eucKrDecoder = new TextDecoder('euc-kr');
                        text = eucKrDecoder.decode(buffer);
                    } catch (eucErr) {
                        const ansiDecoder = new TextDecoder('iso-8859-1');
                        text = ansiDecoder.decode(buffer);
                    }
                }

                parseCSVData(text);
            };
            
            reader.readAsArrayBuffer(file);
        }

        function parseCSVData(text) {
            const lines = text.split(/\r\n|\n/);
            const parsed = [];
            let isHeader = true;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const tokens = parseCSVLine(line);
                if (tokens.length < 2) continue;

                if (isHeader && (tokens[0].includes("지문") || tokens[0].includes("question") || tokens[0].toLowerCase().includes("article"))) {
                    isHeader = false;
                    continue;
                }
                isHeader = false;

                const article = tokens[0] ? tokens[0].trim() : "";
                const answer = tokens[1] ? tokens[1].trim().toUpperCase() : "O";
                const reason = tokens[2] ? tokens[2].trim() : "해설이 제공되지 않았습니다.";

                if (article) {
                    parsed.push({
                        id: parsed.length + 1,
                        article,
                        answer,
                        reason
                    });
                }
            }

            if (parsed.length > 0) {
                rawDeck = parsed;
                for (let key in userAnswers) delete userAnswers[key];
                
                saveDeckToStorage();
                saveAnswersToStorage();

                setFilter('ALL');
                alert(`성공적으로 ${parsed.length}개의 OX 문제를 불러왔으며 브라우저에 자동 저장되었습니다!`);
            } else {
                alert("CSV 파일에서 유효한 문제 데이터를 찾지 못했습니다. 템플릿 양식을 확인해 주세요.");
            }
        }

        function parseCSVLine(text) {
            const delimiter = text.includes('\t') ? '\t' : ',';
            const result = [];
            let cur = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === delimiter && !inQuotes) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur);
            return result.map(str => str.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function downloadCSVTemplate() {
            const csvContent = "\uFEFF지문,정답,해설\n" +
                "\"독립한 부동산은 종물이 될 수 없다.\",X,\"독립된 건물이라도 주물의 효용을 돕는다면 종물이 될 수 있습니다.\"\n" +
                "\"부첩관계의 종료를 해제조건으로 하는 증여계약은 무효이다.\",O,\"불륜관계 유지를 강요하는 불법조건이므로 무효입니다.\"\n" +
                "\"이중매매임을 알고 매수한 것만으로 무효가 되지는 않는다.\",O,\"단순 악의만으로는 유효하며, 적극 가담해야 무효가 됩니다.\"";

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "민법_OX_플래시카드_템플릿.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        renderCard();
    </script>
